<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片展示页</title>
    <style>
        body {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
        }
        h2 {
            margin-top: 30px;
            font-size: 18px;
        }
        img {
            max-width: 100%;
            margin: 10px 0;
            display: block;
        }
    </style>
</head>
<body>
    <h1>素材展示</h1>

    <h2>图标类</h2>
    <img src="images/360图标2.webp" alt="360图标2">
    <img src="images/3603.webp" alt="3603">

    <h2>头像</h2>
    <img src="images/avatar-1.png" alt="头像1">
    <img src="images/avatar-2.png" alt="头像2">
    <img src="images/avatar-3.png" alt="头像3">

    <h2>功能图标</h2>
    <img src="images/feature-camera.png" alt="相机功能">
    <img src="images/feature-game.png" alt="游戏功能">
    <img src="images/feature-screen.png" alt="录屏功能">

    <h2>主视觉图</h2>
    <img src="images/hero-main.png" alt="主视觉">

</body>
</html>
